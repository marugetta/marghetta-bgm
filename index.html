<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8546B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="マルゲッタBGM">
<meta name="robots" content="noindex, nofollow">
<title>マルゲッタ BGM</title>
<style>
  :root{
    --pink:#E8546B; --pink-d:#C93E55; --pink-l:#FBE3E6;
    --cream:#FFF8F0; --ink:#3B2A2A; --muted:#8C7774; --line:#F0DCD6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--cream);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
  body{min-height:100dvh;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px}
  .brand{font-weight:800;letter-spacing:.06em;font-size:15px;color:var(--pink-d)}
  .brand small{display:block;font-weight:500;letter-spacing:.02em;font-size:11px;color:var(--muted)}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;
    font-size:12px;color:var(--ink);display:flex;gap:6px;align-items:center;cursor:pointer}
  .chip.on{background:var(--pink);border-color:var(--pink);color:#fff}

  .now{margin:8px 16px 0;background:#fff;border:1px solid var(--line);border-radius:22px;
    padding:20px 18px 16px;box-shadow:0 6px 20px rgba(232,84,107,.08)}
  .disc{width:132px;height:132px;margin:2px auto 14px;border-radius:50%;
    background:radial-gradient(circle at 50% 50%,var(--cream) 0 15%,var(--pink) 16% 17%,
      #F37A8C 18% 44%,var(--pink) 45% 70%,var(--pink-d) 71% 100%);
    box-shadow:0 8px 22px rgba(201,62,85,.25)}
  .playing .disc{animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .title{font-size:18px;font-weight:700;text-align:center;line-height:1.35;
    min-height:2.7em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .sub{text-align:center;font-size:12px;color:var(--muted);margin-top:2px}
  .seek{margin-top:14px}
  input[type=range]{width:100%;accent-color:var(--pink);height:28px}
  .times{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .controls{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:6px}
  .btn{border:none;background:none;color:var(--ink);width:48px;height:48px;border-radius:50%;
    display:grid;place-items:center;cursor:pointer}
  .btn svg{width:26px;height:26px;fill:currentColor}
  .btn.small svg{width:22px;height:22px}
  .btn.toggle{color:#C9B5B1}
  .btn.toggle.on{color:var(--pink)}
  .btn.main{width:72px;height:72px;background:var(--pink);color:#fff;box-shadow:0 6px 16px rgba(232,84,107,.35)}
  .btn.main svg{width:34px;height:34px}
  .btn:active{transform:scale(.94)}
  .vol{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--muted);font-size:12px}
  .vol input{flex:1}

  .tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 16px 4px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;
    font-size:13px;cursor:pointer;color:var(--ink)}
  .tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .search{margin:8px 16px 0;position:relative}
  .search input{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    font-size:16px;background:#fff;color:var(--ink)}
  ol{list-style:none;margin:8px 0 0;padding:0 8px 24px;flex:1}
  li{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:12px;cursor:pointer}
  li:active{background:var(--pink-l)}
  li .n{width:26px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  li .t{flex:1;font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  li.cur{background:var(--pink-l)}
  li.cur .t{color:var(--pink-d);font-weight:700}
  li.cur .n{color:var(--pink)}
  .msg{margin:24px 20px;padding:16px;border-radius:14px;background:#fff;border:1px dashed var(--line);
    font-size:13px;line-height:1.7;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;opacity:0;
    transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:.92}
  @media (min-width:700px){
    body{max-width:560px;margin:0 auto}
  }
</style>
</head>
<body>
<header>
  <div class="brand">MARGHETTA BGM<small>めんたいこ生パスタ マルゲッタ</small></div>
  <div style="display:flex;gap:6px">
    <button class="chip" id="autoBtn" title="時間帯でプレイリストを自動切替">⏰ 自動</button>
    <button class="chip" id="wakeBtn" title="再生中は画面を消さない">☀ 画面ON</button>
  </div>
</header>

<section class="now" id="now">
  <div class="disc"></div>
  <div class="title" id="title">曲を読み込み中…</div>
  <div class="sub" id="sub">&nbsp;</div>
  <div class="seek">
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="再生位置">
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  </div>
  <div class="controls">
    <button class="btn small toggle" id="shuffleBtn" aria-label="シャッフル">
      <svg viewBox="0 0 24 24"><path d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2 1.4-1.4ZM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4h-5.5Zm.3 9.4-1.4 1.4 3.1 3.1-2 2.1H20v-5.5l-2 2-3.2-3.1Z"/></svg>
    </button>
    <button class="btn" id="prevBtn" aria-label="前の曲"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button class="btn main" id="playBtn" aria-label="再生"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="btn" id="nextBtn" aria-label="次の曲"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    <button class="btn small toggle on" id="repeatBtn" aria-label="ループ">
      <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
    </button>
  </div>
  <div class="vol" id="volRow">🔈<input type="range" id="vol" min="0" max="100" value="70" aria-label="音量">🔊</div>
</section>

<nav class="tabs" id="tabs"></nav>
<div class="search"><input type="search" id="q" placeholder="曲名で検索" autocomplete="off"></div>
<ol id="list"></ol>
<div class="toast" id="toast"></div>

<audio id="audio" preload="auto" playsinline></audio>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const audio = $('audio');
  const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  const store = {
    get(k, d){ try{ const v = localStorage.getItem('mbgm:'+k); return v === null ? d : JSON.parse(v); }catch{ return d; } },
    set(k, v){ try{ localStorage.setItem('mbgm:'+k, JSON.stringify(v)); }catch{} }
  };

  let data = { playlists: [], schedule: [] };
  let plIndex = 0;          // 表示・再生中のプレイリスト
  let order = [];           // 再生順（曲インデックス）
  let pos = 0;              // order 内の位置
  let shuffle = store.get('shuffle', true);
  let repeat = store.get('repeat', true);
  let auto = store.get('auto', true);
  let wakeWanted = store.get('wake', true);
  let wakeLock = null;
  let pendingSwitch = null; // 自動切替：曲の終わりで切り替える

  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS) $('volRow').style.display = 'none'; // iOSはブラウザから音量変更不可

  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
  }
  const fmt = s => { if(!isFinite(s)) return '0:00'; s = Math.floor(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
  const songs = () => data.playlists[plIndex]?.songs || [];
  const current = () => songs()[order[pos]];
  const urlOf = f => f.split('/').map(encodeURIComponent).join('/');

  function makeOrder(startSong){
    const n = songs().length;
    order = [...Array(n).keys()];
    if (shuffle){
      for (let i = n-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [order[i],order[j]] = [order[j],order[i]]; }
      if (startSong != null){ const k = order.indexOf(startSong); if (k > 0){ [order[0],order[k]] = [order[k],order[0]]; } }
      pos = 0;
    } else {
      pos = startSong != null ? startSong : 0;
    }
  }

  function load(play){
    const s = current();
    if (!s){ $('title').textContent = '曲がありません'; return; }
    audio.src = urlOf(s.file);
    $('title').textContent = s.title;
    $('sub').textContent = `${data.playlists[plIndex].label}　${order[pos]+1} / ${songs().length}`;
    document.title = `♪ ${s.title} | マルゲッタ BGM`;
    renderList();
    if ('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({ title: s.title, artist: 'マルゲッタ', album: data.playlists[plIndex].label });
    }
    if (play) audio.play().catch(() => {});
  }

  function next(auto_){
    if (pendingSwitch != null && auto_){ const p = pendingSwitch; pendingSwitch = null; selectPlaylist(p, true, true); return; }
    if (pos < order.length - 1){ pos++; }
    else if (repeat){ makeOrder(); pos = 0; }
    else { audio.pause(); return; }
    load(true);
  }
  function prev(){
    if (audio.currentTime > 3){ audio.currentTime = 0; return; }
    pos = (pos - 1 + order.length) % order.length; load(true);
  }

  function selectPlaylist(i, play, fromAuto){
    plIndex = i; makeOrder(); store.set('pl', data.playlists[i].id);
    renderTabs(); load(play);
    if (fromAuto) toast(`時間帯に合わせて「${data.playlists[i].label}」に切り替えました`);
  }

  function renderTabs(){
    $('tabs').innerHTML = '';
    data.playlists.forEach((p, i) => {
      const b = document.createElement('button');
      b.className = 'tab' + (i === plIndex ? ' on' : '');
      b.textContent = `${p.label}（${p.songs.length}）`;
      b.onclick = () => { if (auto){ auto = false; store.set('auto', false); syncChips(); toast('手動選択のため自動切替をOFFにしました'); }
        selectPlaylist(i, !audio.paused); };
      $('tabs').appendChild(b);
    });
  }

  function renderList(){
    const q = $('q').value.trim().toLowerCase();
    const cur = order[pos];
    const ol = $('list'); ol.innerHTML = '';
    songs().forEach((s, i) => {
      if (q && !s.title.toLowerCase().includes(q)) return;
      const li = document.createElement('li');
      if (i === cur) li.className = 'cur';
      li.innerHTML = `<span class="n">${i === cur && !audio.paused ? '♪' : i+1}</span><span class="t"></span>`;
      li.querySelector('.t').textContent = s.title;
      li.onclick = () => { makeOrder(i); if(!shuffle) pos = i; load(true); };
      ol.appendChild(li);
    });
  }

  // --- 時間帯の自動切替 ---
  function scheduledPlaylist(){
    const now = new Date(), m = now.getHours()*60 + now.getMinutes();
    for (const r of data.schedule || []){
      const [a, b] = [r.start, r.end].map(t => { const [h, mi] = t.split(':').map(Number); return h*60+mi; });
      const inRange = a <= b ? (m >= a && m < b) : (m >= a || m < b);
      if (inRange){ const i = data.playlists.findIndex(p => p.id === r.playlist); if (i >= 0) return i; }
    }
    return -1;
  }
  function checkSchedule(){
    if (!auto) return;
    const i = scheduledPlaylist();
    if (i < 0 || i === plIndex) { pendingSwitch = null; return; }
    if (audio.paused) selectPlaylist(i, false, true);
    else pendingSwitch = i; // 今の曲が終わったら切り替える
  }

  // --- 画面スリープ防止 ---
  async function applyWake(){
    if (!('wakeLock' in navigator)) return;
    try{
      if (wakeWanted && !audio.paused && document.visibilityState === 'visible'){
        if (!wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); }
      } else if (wakeLock){ await wakeLock.release(); wakeLock = null; }
    }catch{}
  }

  function syncChips(){
    $('autoBtn').classList.toggle('on', auto);
    $('wakeBtn').classList.toggle('on', wakeWanted);
    $('shuffleBtn').classList.toggle('on', shuffle);
    $('repeatBtn').classList.toggle('on', repeat);
  }

  // --- イベント ---
  $('playBtn').onclick = () => { if (!audio.src) load(false); audio.paused ? audio.play().catch(()=>toast('再生できませんでした')) : audio.pause(); };
  $('nextBtn').onclick = () => next(false);
  $('prevBtn').onclick = prev;
  $('shuffleBtn').onclick = () => { shuffle = !shuffle; store.set('shuffle', shuffle); const c = order[pos]; makeOrder(c); syncChips(); toast(shuffle ? 'シャッフル ON' : 'シャッフル OFF'); };
  $('repeatBtn').onclick = () => { repeat = !repeat; store.set('repeat', repeat); syncChips(); toast(repeat ? 'ループ ON' : 'ループ OFF'); };
  $('autoBtn').onclick = () => { auto = !auto; store.set('auto', auto); syncChips();
    toast(auto ? (data.schedule?.length ? '時間帯で自動切替 ON' : '時間帯の設定がありません（schedule.json）') : '自動切替 OFF'); checkSchedule(); };
  $('wakeBtn').onclick = () => { wakeWanted = !wakeWanted; store.set('wake', wakeWanted); syncChips(); applyWake();
    if (!('wakeLock' in navigator)) toast('この端末では未対応です。端末の自動ロックをOFFにしてください'); };
  $('q').oninput = renderList;
  $('vol').oninput = e => { audio.volume = e.target.value/100; store.set('vol', +e.target.value); };
  $('seek').oninput = e => { if (audio.duration) audio.currentTime = e.target.value/1000*audio.duration; };

  audio.addEventListener('play', () => { $('now').classList.add('playing'); $('playIcon').innerHTML = ICON_PAUSE; renderList(); applyWake(); });
  audio.addEventListener('pause', () => { $('now').classList.remove('playing'); $('playIcon').innerHTML = ICON_PLAY; renderList(); applyWake(); });
  audio.addEventListener('ended', () => next(true));
  audio.addEventListener('error', () => { if (!audio.src) return; toast('読み込めない曲をスキップしました'); setTimeout(() => next(true), 800); });
  audio.addEventListener('timeupdate', () => {
    $('cur').textContent = fmt(audio.currentTime); $('dur').textContent = fmt(audio.duration);
    if (audio.duration) $('seek').value = audio.currentTime/audio.duration*1000;
  });
  document.addEventListener('visibilitychange', applyWake);
  if ('mediaSession' in navigator){
    navigator.mediaSession.setActionHandler('play', () => audio.play());
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('nexttrack', () => next(false));
    navigator.mediaSession.setActionHandler('previoustrack', prev);
  }

  // --- 起動 ---
  const v = store.get('vol', 70); $('vol').value = v; audio.volume = v/100;
  syncChips();
  fetch('songs.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(json => {
      data = json;
      if (!data.playlists?.length || !data.playlists.some(p => p.songs.length)) throw 'empty';
      let i = auto ? scheduledPlaylist() : -1;
      if (i < 0) i = Math.max(0, data.playlists.findIndex(p => p.id === store.get('pl', '')));
      plIndex = i; makeOrder(); renderTabs(); load(false);
      $('title').textContent = current()?.title || '';
      setInterval(checkSchedule, 30000);
    })
    .catch(e => {
      $('title').textContent = '曲がまだありません';
      $('list').outerHTML = `<div class="msg">GitHub の <b>music</b> フォルダに MP3 をアップロードすると、数分後にここに曲が表示されます。<br>
        フォルダ分け（例：music/lunch、music/dinner）するとプレイリストになります。</div>`;
    });
})();
</script>
</body>
</html>
