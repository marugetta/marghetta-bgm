<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8546B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="マルゲッタBGM">
<meta name="robots" content="noindex, nofollow">
<title>マルゲッタ BGM</title>
<style>
  :root{
    --pink:#E8546B; --pink-d:#C93E55; --coral:#F58A6E; --pink-l:#FDECEE;
    --cream:#FFF8F2; --card:#FFFFFF; --ink:#3B2A2A; --muted:#8C7774; --line:#F2E1DB;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--cream);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
  body{min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  button{font:inherit}

  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 8px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;
    font-weight:800;font-size:17px;background:linear-gradient(135deg,var(--coral),var(--pink-d))}
  .brand b{display:block;font-size:14px;letter-spacing:.04em;color:var(--pink-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chips{display:flex;gap:4px;flex:none}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 9px;
    font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

  /* 再生中カード */
  .now{margin:6px 16px 0;border-radius:26px;padding:20px 18px 14px;color:#fff;position:relative;overflow:hidden;
    background:linear-gradient(150deg,var(--coral) 0%,var(--pink) 45%,var(--pink-d) 100%);
    box-shadow:0 12px 30px rgba(201,62,85,.28)}
  .now::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;
    background:rgba(255,255,255,.08);pointer-events:none}
  .np{display:flex;align-items:center;gap:16px}
  .disc{flex:none;width:92px;height:92px;border-radius:50%;
    background:radial-gradient(circle,#fff 0 9%,var(--pink-d) 10% 12%,#2E2024 13% 30%,#3A2A2E 31% 33%,#2E2024 34% 56%,#3A2A2E 57% 59%,#2E2024 60% 100%);
    box-shadow:0 6px 16px rgba(0,0,0,.25),inset 0 0 0 3px rgba(255,255,255,.15)}
  .playing .disc{animation:spin 5s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .meta{min-width:0;flex:1}
  .eyebrow{font-size:11px;letter-spacing:.12em;opacity:.85}
  .title{font-size:19px;font-weight:800;line-height:1.3;margin-top:4px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
  .sub{font-size:12px;opacity:.9;margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .qchip{display:none;align-items:center;gap:4px;background:rgba(255,255,255,.22);border:none;color:#fff;
    border-radius:999px;padding:3px 9px;font-size:11px;cursor:pointer}
  .qchip.show{display:inline-flex}
  .djb{display:none;background:rgba(0,0,0,.25);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;animation:djpulse 1s ease-in-out infinite alternate}
  .djb.show{display:inline-block}
  @keyframes djpulse{from{opacity:.65}to{opacity:1}}
  .bpm{display:none;background:rgba(255,255,255,.22);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;
    letter-spacing:.04em;font-variant-numeric:tabular-nums}
  .bpm.show{display:inline-block}
  .seek{margin-top:14px}
  input[type=range]{--p:0%;width:100%;height:26px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;
    background:linear-gradient(to right,#fff var(--p),rgba(255,255,255,.3) var(--p))}
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;
    background:linear-gradient(to right,#fff var(--p),rgba(255,255,255,.3) var(--p))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;
    background:#fff;border:none;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:none}
  .times{display:flex;justify-content:space-between;font-size:11px;opacity:.85;font-variant-numeric:tabular-nums}
  .controls{display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding:0 4px}
  .btn{border:none;background:none;color:#fff;width:48px;height:48px;border-radius:50%;
    display:grid;place-items:center;cursor:pointer}
  .btn svg{width:28px;height:28px;fill:currentColor}
  .btn.small svg{width:22px;height:22px}
  .btn.toggle{opacity:.45}
  .btn.toggle.on{opacity:1}
  .btn.main{width:68px;height:68px;background:#fff;color:var(--pink);box-shadow:0 6px 16px rgba(0,0,0,.18)}
  .btn.main svg{width:34px;height:34px}
  .btn:active{transform:scale(.93)}
  .vol{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12px}
  .vol input{flex:1}
  .speed{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:12px}
  .speed span{flex:none;opacity:.9}
  .speed input{flex:1}
  .rate{flex:none;min-width:58px;border:none;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;
    background:rgba(255,255,255,.22);color:#fff;cursor:pointer;font-variant-numeric:tabular-nums}
  .rate.changed{background:#fff;color:var(--pink-d)}

  /* 検索・タグ（スクロールしても上に残る） */
  .finder{position:sticky;top:0;z-index:5;background:var(--cream);padding:12px 0 8px;
    box-shadow:0 8px 12px -12px rgba(59,42,42,.25)}
  .row{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  .tab{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;
    font-size:13px;cursor:pointer;color:var(--ink)}
  .tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .search{margin:10px 16px 0;position:relative}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:var(--muted)}
  .search input{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px 36px 11px 38px;
    font-size:16px;background:var(--card);color:var(--ink);-webkit-appearance:none;appearance:none}
  .search input:focus{outline:2px solid var(--pink-l);border-color:var(--pink)}
  .search input::-webkit-search-cancel-button{display:none}
  .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;
    color:var(--muted);font-size:18px;width:32px;height:32px;cursor:pointer;display:none}
  .clear.show{display:block}
  .tags{margin-top:10px}
  .tag{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;
    font-size:13px;cursor:pointer;color:var(--pink-d)}
  .tag small{color:var(--muted);margin-left:2px}
  .tag.on{background:var(--pink);border-color:var(--pink);color:#fff}
  .tag.on small{color:rgba(255,255,255,.8)}
  .tempos{margin-top:8px}
  .tempo{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;
    font-size:13px;cursor:pointer;color:var(--ink)}
  .tempo small{color:var(--muted);margin-left:4px}
  .tempo.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .tempo.on small{color:rgba(255,255,255,.75)}
  .actions{display:flex;align-items:center;gap:8px;margin:12px 16px 0}
  .count{flex:1;font-size:13px;color:var(--muted)}
  .count b{color:var(--ink);font-size:15px}
  .act{border:none;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:6px;white-space:nowrap}
  .act svg{width:16px;height:16px;fill:currentColor}
  .act.seq{background:var(--ink);color:#fff}
  .act.shf{background:var(--pink);color:#fff}
  .act:active{transform:scale(.96)}
  .act:disabled{opacity:.4}

  ol{list-style:none;margin:4px 0 0;padding:0 12px 32px}
  li{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;cursor:pointer}
  li:active{background:var(--pink-l)}
  li .n{flex:none;width:26px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  li .b{flex:1;min-width:0}
  li .t{font-size:14px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  li .tg{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
  li .tg span{font-size:11px;color:var(--pink-d);background:var(--pink-l);border-radius:6px;padding:1px 6px}
  .lyr{flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;
    padding:3px 7px;font-size:11px;cursor:pointer}
  .lyr:active{transform:scale(.92)}
  .now .lyr{display:none;border:none;background:rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:2px 10px;font-weight:700}
  .now .lyr.show{display:inline-block}
  .sheet{position:fixed;inset:0;z-index:20;background:rgba(40,25,28,.45);display:flex;align-items:flex-end;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet.show{opacity:1;pointer-events:auto}
  .panel{width:100%;max-width:560px;max-height:82dvh;background:var(--cream);border-radius:24px 24px 0 0;display:flex;flex-direction:column;
    transform:translateY(30px);transition:transform .25s;padding-bottom:env(safe-area-inset-bottom)}
  .sheet.show .panel{transform:none}
  .panel header{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
  .panel header b{font-size:16px;color:var(--pink-d);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .panel header button{flex:none;border:none;background:var(--card);border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;color:var(--ink)}
  .lyrics{overflow-y:auto;padding:12px 22px 32px;font-size:16px;line-height:1.9;-webkit-overflow-scrolling:touch}
  .lyrics .sec{margin-top:18px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--pink);text-transform:uppercase}
  .lyrics .sec:first-child{margin-top:4px}
  .lyrics .gap{height:.8em}
  .lyrics .gap + .sec{margin-top:6px}
  .lyr-msg{color:var(--muted);text-align:center;padding:24px 0;font-size:13px}
  li .bp{flex:none;text-align:right;font-size:15px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
  li .bp small{display:block;font-size:9px;font-weight:500;color:var(--muted);letter-spacing:.06em;margin-top:2px}
  li.cur{background:var(--card);box-shadow:0 2px 10px rgba(201,62,85,.12)}
  li.cur .t{color:var(--pink-d);font-weight:700}
  li.cur .n{color:var(--pink);font-weight:700}
  li.out{opacity:.6}
  .star{flex:none;border:none;background:none;width:36px;height:36px;margin:-6px -4px -6px 0;border-radius:50%;
    display:grid;place-items:center;cursor:pointer;color:#D9C6C1}
  .star svg{width:22px;height:22px;fill:currentColor}
  .star.on{color:#F2B33D}
  .star:active{transform:scale(.85)}
  .eyebrow{display:flex;align-items:center;justify-content:space-between}
  .now .star{color:rgba(255,255,255,.55);width:40px;height:40px;margin:-10px -8px -10px 0}
  .now .star svg{width:26px;height:26px}
  .now .star.on{color:#FFD45C}
  .tag.fav{color:#B7801A}
  .tag.fav.on{background:#F2B33D;border-color:#F2B33D;color:#fff}
  .backup{margin:0 16px 40px;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .backup span{flex:1}
  .backup button{border:1px solid var(--line);background:var(--cream);color:var(--ink);border-radius:999px;
    padding:7px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:32px 16px}
  .msg{margin:24px 20px;padding:16px;border-radius:14px;background:var(--card);border:1px dashed var(--line);
    font-size:13px;line-height:1.7;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;opacity:0;z-index:10;
    transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:.94}
  @media (min-width:700px){ body{max-width:560px;margin:0 auto} }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">M</div>
    <div style="min-width:0"><b>MARGHETTA BGM</b><small>めんたいこ生パスタ マルゲッタ</small></div>
  </div>
  <div class="chips">
    <button class="chip" id="djBtn" title="曲をDJのようにつなぐ">🎧 DJ</button>
    <button class="chip" id="autoBtn" title="時間帯でプレイリストを自動切替">⏰ 自動</button>
    <button class="chip" id="wakeBtn" title="再生中は画面を消さない">☀ 画面ON</button>
  </div>
</header>

<section class="now" id="now">
  <div class="np">
    <div class="disc"></div>
    <div class="meta">
      <div class="eyebrow">NOW PLAYING<button class="star" id="nowStar" aria-label="お気に入り"></button></div>
      <div class="title" id="title">曲を読み込み中…</div>
      <div class="sub"><span id="sub">&nbsp;</span><span class="bpm" id="bpm"></span><button class="lyr" id="nowLyr">歌詞</button><button class="qchip" id="qchip" aria-label="絞り込み再生を解除"></button><span class="djb" id="djBadge"></span><button class="qchip" id="djTry" title="今の曲を、次の曲へつなぐ少し前まで進める">⏭ つなぎ目を試す</button></div>
    </div>
  </div>
  <div class="seek">
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="再生位置">
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  </div>
  <div class="controls">
    <button class="btn small toggle" id="shuffleBtn" aria-label="シャッフル">
      <svg viewBox="0 0 24 24"><path d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2 1.4-1.4ZM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4h-5.5Zm.3 9.4-1.4 1.4 3.1 3.1-2 2.1H20v-5.5l-2 2-3.2-3.1Z"/></svg>
    </button>
    <button class="btn" id="prevBtn" aria-label="前の曲"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button class="btn main" id="playBtn" aria-label="再生"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="btn" id="nextBtn" aria-label="次の曲"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    <button class="btn small toggle on" id="repeatBtn" aria-label="ループ">
      <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
    </button>
  </div>
  <div class="vol" id="volRow">🔈<input type="range" id="vol" min="0" max="100" value="70" aria-label="音量">🔊</div>
  <div class="speed"><span>テンポ</span><input type="range" id="rate" min="80" max="120" step="5" value="100" aria-label="テンポ">
    <button class="rate" id="rateBtn" title="100%に戻す">100%</button></div>
</section>

<section class="finder" id="finder">
  <nav class="row" id="tabs"></nav>
  <div class="search">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 9.5 16a6.5 6.5 0 0 0 4.2-1.6l.3.3v.8l5 5 1.5-1.5-5-5Zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Z"/></svg>
    <input type="search" id="q" placeholder="曲名・#タグで検索" autocomplete="off" enterkeyhint="search">
    <button class="clear" id="clearBtn" aria-label="検索をクリア">×</button>
  </div>
  <div class="row tags" id="tags"></div>
  <div class="row tempos" id="tempos"></div>
  <div class="actions">
    <div class="count" id="count"></div>
    <button class="act seq" id="playSeqBtn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>順番に再生</button>
    <button class="act shf" id="playShfBtn"><svg viewBox="0 0 24 24"><path d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2 1.4-1.4ZM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4h-5.5Zm.3 9.4-1.4 1.4 3.1 3.1-2 2.1H20v-5.5l-2 2-3.2-3.1Z"/></svg>シャッフル</button>
  </div>
</section>
<ol id="list"></ol>
<div class="backup" id="backup"><span id="favCount"></span>
  <button id="exportBtn">バックアップ</button><button id="importBtn">復元</button></div>
<div class="sheet" id="sheet" role="dialog" aria-label="歌詞">
  <div class="panel"><header><b id="lyrTitle"></b><button id="lyrClose" aria-label="閉じる">×</button></header>
    <div class="lyrics" id="lyrBody"></div></div>
</div>
<div class="toast" id="toast"></div>

<audio id="audio" preload="auto" playsinline></audio>
<audio id="audio2" preload="auto" playsinline></audio>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const decks = [$('audio'), $('audio2')]; // DJミックスで2台を交互に使う
  let audio = decks[0];                     // いま流れている（主役の）方
  const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  const store = {
    get(k, d){ try{ const v = localStorage.getItem('mbgm:'+k); return v === null ? d : JSON.parse(v); }catch{ return d; } },
    set(k, v){ try{ localStorage.setItem('mbgm:'+k, JSON.stringify(v)); }catch{} }
  };

  let data = { playlists: [], schedule: [], tags: [] };
  let plIndex = 0;          // 表示・再生中のプレイリスト
  let queue = [];           // 再生する曲（曲インデックス）。絞り込み再生のときはその曲だけ
  let queueLabel = '';      // 絞り込み再生の名前（例：#ハロウィン）
  let order = [];           // 再生順（曲インデックス）
  let pos = 0;              // order 内の位置
  let tagFilter = '';       // 選んでいるタグ
  let tempoFilter = '';     // 選んでいるテンポ
  // テンポの区切り（BPM）。max 未満がその区分
  const TEMPOS = [
    { id: 'slow', label: 'ゆったり', max: 110 },
    { id: 'mid',  label: 'ふつう',   max: 128 },
    { id: 'fast', label: 'アップテンポ', max: Infinity },
  ];
  const bpmOf = s => s.bpm ? Math.round(s.bpm * rate / 100) : 0; // テンポ変更後のBPM
  const tempoOf = s => s.bpm ? TEMPOS.find(t => bpmOf(s) < t.max).id : '';
  let shuffle = store.get('shuffle', true);
  let repeat = store.get('repeat', true);
  let auto = store.get('auto', true);
  let wakeWanted = store.get('wake', true);
  let favs = new Set(store.get('favs', [])); // お気に入り（曲名）。この端末だけに保存
  let favFilter = false;
  const STAR = '<svg viewBox="0 0 24 24"><path d="M12 17.3 18.2 21l-1.6-7 5.4-4.7-7.2-.6L12 2 9.2 8.7 2 9.3l5.4 4.7-1.6 7z"/></svg>';
  let rate = store.get('rate', 100); // テンポ（%）。音程は変えずに速さだけ変える
  let wakeLock = null;
  let advancing = false;    // 曲の終わる少し前に、次の曲へ切り替え済み
  let pendingSwitch = null; // 自動切替：曲の終わりで切り替える

  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS) $('volRow').style.display = 'none'; // iOSはブラウザから音量変更不可

  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
  }
  const fmt = s => { if(!isFinite(s)) return '0:00'; s = Math.floor(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
  const songs = () => data.playlists[plIndex]?.songs || [];
  const current = () => songs()[order[pos]];
  const urlOf = f => f.split('/').map(encodeURIComponent).join('/');
  const norm = s => s.normalize('NFKC').toLowerCase();

  // --- 検索・タグの絞り込み ---
  function filterLabel(){
    const q = $('q').value.trim();
    const tp = TEMPOS.find(t => t.id === tempoFilter);
    return [favFilter && '★お気に入り', tagFilter && '#' + tagFilter, tp && tp.label, q && `「${q}」`].filter(Boolean).join(' ');
  }
  function matches(s){
    if (favFilter && !favs.has(s.title)) return false;
    if (tagFilter && !(s.tags || []).includes(tagFilter)) return false;
    if (tempoFilter && tempoOf(s) !== tempoFilter) return false;
    const q = norm($('q').value.trim());
    if (!q) return true;
    const words = q.split(/\s+/);
    return words.every(w => w.startsWith('#')
      ? (s.tags || []).some(t => norm(t).includes(w.slice(1)))
      : norm(s.title).includes(w) || (s.tags || []).some(t => norm(t).includes(w)));
  }
  const visible = () => songs().map((s, i) => i).filter(i => matches(songs()[i]));

  function makeOrder(startSong){
    order = [...queue];
    if (shuffle){
      for (let i = order.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [order[i],order[j]] = [order[j],order[i]]; }
      if (startSong != null){ const k = order.indexOf(startSong); if (k > 0){ [order[0],order[k]] = [order[k],order[0]]; } }
      pos = 0;
    } else {
      pos = Math.max(0, order.indexOf(startSong));
    }
  }
  function setQueue(list, label){
    queue = list; queueLabel = label || '';
    $('qchip').textContent = queueLabel ? `${queueLabel} だけ再生中 ×` : '';
    $('qchip').classList.toggle('show', !!queueLabel);
  }
  function manualTakeover(){
    if (auto){ auto = false; store.set('auto', false); syncChips(); toast('手動選択のため自動切替をOFFにしました'); }
  }

  const updateSub = () => { $('sub').textContent = `${data.playlists[plIndex].label}　${pos+1} / ${order.length}`; };

  function load(play){
    djAbort(); advancing = false; cancelAdvance();
    const s = current();
    if (!s){ $('title').textContent = '曲がありません'; return; }
    audio.src = prefetched.get(s.file) || urlOf(s.file); // 先に読み込んでおいた曲があれば、それを使う
    if (play) audio.play().catch(() => {}); // 画面の更新より先に再生を始める（ロック中に音が途切れる時間を短くするため）
    showCurrent();
  }
  // 画面の表示だけを、いまの曲に合わせる（DJミックスでは曲の読み込みをせずに切り替えるため）
  function showCurrent(){
    const s = current();
    $('title').textContent = s.title;
    showBpm(); showFavs();
    $('nowLyr').classList.toggle('show', !!s.lyrics);
    updateSub();
    document.title = `♪ ${s.title} | マルゲッタ BGM`;
    renderList();
    if ('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({ title: s.title, artist: 'マルゲッタ', album: data.playlists[plIndex].label });
    }
  }

  // --- 次の曲の先読み ---
  // 次の曲をまるごと端末に読み込んでおく。電車のトンネルなどで電波が切れても、画面ロック中に次の曲を止まらずに始められるように
  const prefetched = new Map();   // 曲のファイル → 端末内の URL（blob:）
  let prefetching = null;
  async function prefetchNext(){
    if (pendingSwitch != null || pos >= order.length - 1) return; // 最後の曲のあと（並び直し）や時間帯の切替時は、その場で読み込む
    const s = current(), ns = songs()[order[pos + 1]];
    if (!ns || prefetched.has(ns.file) || prefetching === ns.file) return;
    prefetching = ns.file;
    try {
      const r = await fetch(urlOf(ns.file));
      if (!r.ok) throw 0;
      const url = URL.createObjectURL(await r.blob());
      // いま流れている曲と次の曲の分だけ残し、ほかは片づける（端末のメモリを使いすぎないように）
      for (const [f, u] of prefetched) if (f !== s?.file && f !== ns.file){ URL.revokeObjectURL(u); prefetched.delete(f); }
      prefetched.set(ns.file, url);
    } catch {} finally { if (prefetching === ns.file) prefetching = null; }
  }

  function next(auto_){
    if (pendingSwitch != null && auto_){ const p = pendingSwitch; pendingSwitch = null; selectPlaylist(p, true, true); return; }
    if (pos < order.length - 1){ pos++; }
    else if (repeat){ makeOrder(); pos = 0; }
    else { audio.pause(); return; }
    load(true);
  }
  function prev(){
    djAbort();
    if (audio.currentTime > 3){ audio.currentTime = 0; return; }
    pos = (pos - 1 + order.length) % order.length; load(true);
  }

  function selectPlaylist(i, play, fromAuto){
    plIndex = i; setQueue([...songs().keys()]); makeOrder(); store.set('pl', data.playlists[i].id);
    renderTabs(); renderTags(); load(play);
    if (fromAuto) toast(`時間帯に合わせて「${data.playlists[i].label}」に切り替えました`);
  }

  // 絞り込んだ曲だけを再生（mode: 'seq' 上から順番 / 'shf' シャッフル）
  function playVisible(mode){
    const list = visible();
    if (!list.length) return;
    manualTakeover();
    shuffle = mode === 'shf'; store.set('shuffle', shuffle); syncChips();
    setQueue(list, filterLabel());
    makeOrder(shuffle ? null : list[0]);
    load(true);
    toast(`${queueLabel || data.playlists[plIndex].label} を${shuffle ? 'シャッフル' : '順番に'}再生（${list.length}曲）`);
  }

  function renderTabs(){
    $('tabs').innerHTML = '';
    $('tabs').style.display = data.playlists.length > 1 ? '' : 'none';
    data.playlists.forEach((p, i) => {
      const b = document.createElement('button');
      b.className = 'tab' + (i === plIndex ? ' on' : '');
      b.textContent = `${p.label}（${p.songs.length}）`;
      b.onclick = () => { manualTakeover(); selectPlaylist(i, !audio.paused); };
      $('tabs').appendChild(b);
    });
  }

  function renderTags(){
    const el = $('tags'); el.innerHTML = '';
    const counts = {};
    for (const s of songs()) for (const t of s.tags || []) counts[t] = (counts[t] || 0) + 1;
    const names = [...(data.tags || []), ...Object.keys(counts)].filter((t, i, a) => counts[t] && a.indexOf(t) === i);
    if (tagFilter && !counts[tagFilter]) tagFilter = '';
    const nFav = songs().filter(s => favs.has(s.title)).length;
    const f = document.createElement('button');
    f.className = 'tag fav' + (favFilter ? ' on' : '');
    f.innerHTML = `★ お気に入り<small>${nFav}</small>`;
    f.onclick = () => {
      if (!nFav && !favFilter){ toast('曲の ☆ を押すと、お気に入りに追加できます'); return; }
      favFilter = !favFilter; renderTags(); renderList();
    };
    el.appendChild(f);
    names.forEach(t => {
      const b = document.createElement('button');
      b.className = 'tag' + (t === tagFilter ? ' on' : '');
      b.innerHTML = `#<span></span><small>${counts[t]}</small>`;
      b.querySelector('span').textContent = t;
      b.onclick = () => { tagFilter = tagFilter === t ? '' : t; renderTags(); renderList(); };
      el.appendChild(b);
    });
    renderTempos();
  }

  function renderTempos(){
    const el = $('tempos'); el.innerHTML = '';
    const counts = {};
    for (const s of songs()) { const t = tempoOf(s); if (t) counts[t] = (counts[t] || 0) + 1; }
    if (tempoFilter && !counts[tempoFilter]) tempoFilter = '';
    // 全曲が同じ区分なら絞り込む意味がないので出さない
    el.style.display = Object.keys(counts).length > 1 ? '' : 'none';
    TEMPOS.forEach((t, k) => {
      if (!counts[t.id]) return;
      const lo = k ? TEMPOS[k-1].max : 0;
      const b = document.createElement('button');
      b.className = 'tempo' + (t.id === tempoFilter ? ' on' : '');
      b.innerHTML = `♩ ${t.label}<small>${lo ? lo : ''}〜${isFinite(t.max) ? t.max - 1 : ''}　${counts[t.id]}曲</small>`;
      b.onclick = () => { tempoFilter = tempoFilter === t.id ? '' : t.id; renderTempos(); renderList(); };
      el.appendChild(b);
    });
  }

  function renderList(){
    const list = visible();
    const filtered = list.length !== songs().length;
    const cur = order[pos];
    const ol = $('list'); ol.innerHTML = '';
    $('clearBtn').classList.toggle('show', !!$('q').value);
    $('count').innerHTML = filtered ? `<b>${list.length}</b> 曲` : `全 <b>${list.length}</b> 曲`;
    $('playSeqBtn').disabled = $('playShfBtn').disabled = !list.length;
    if (!list.length){ ol.innerHTML = '<div class="empty">該当する曲がありません</div>'; return; }
    list.forEach((i, k) => {
      const s = songs()[i];
      const li = document.createElement('li');
      li.className = (i === cur ? 'cur' : '') + (queueLabel && !queue.includes(i) ? ' out' : '');
      li.innerHTML = `<span class="n">${i === cur && !audio.paused ? '♪' : k+1}</span><div class="b"><div class="t"></div><div class="tg"></div></div>${s.lyrics ? '<button class="lyr">歌詞</button>' : ''}<button class="star${favs.has(s.title) ? ' on' : ''}" aria-label="お気に入り">${STAR}</button>${s.bpm ? `<span class="bp">${bpmOf(s)}<small>BPM</small></span>` : ''}`;
      li.querySelector('.t').textContent = s.title;
      li.querySelector('.star').onclick = e => { e.stopPropagation(); toggleFav(s); };
      if (s.lyrics) li.querySelector('.lyr').onclick = e => { e.stopPropagation(); openLyrics(s); };
      for (const t of s.tags || []){ const sp = document.createElement('span'); sp.textContent = '#' + t; li.querySelector('.tg').appendChild(sp); }
      // タップした曲から、いま表示している曲の範囲で再生
      li.onclick = () => {
        if (filtered){ manualTakeover(); setQueue(list, filterLabel()); }
        else setQueue([...songs().keys()]);
        makeOrder(i); load(true);
      };
      ol.appendChild(li);
    });
  }

  // --- 時間帯の自動切替 ---
  function scheduledPlaylist(){
    const now = new Date(), m = now.getHours()*60 + now.getMinutes();
    for (const r of data.schedule || []){
      const [a, b] = [r.start, r.end].map(t => { const [h, mi] = t.split(':').map(Number); return h*60+mi; });
      const inRange = a <= b ? (m >= a && m < b) : (m >= a || m < b);
      if (inRange){ const i = data.playlists.findIndex(p => p.id === r.playlist); if (i >= 0) return i; }
    }
    return -1;
  }
  function checkSchedule(){
    if (!auto) return;
    const i = scheduledPlaylist();
    if (i < 0 || i === plIndex) { pendingSwitch = null; return; }
    if (audio.paused) selectPlaylist(i, false, true);
    else pendingSwitch = i; // 今の曲が終わったら切り替える
  }

  // --- 画面スリープ防止 ---
  async function applyWake(){
    if (!('wakeLock' in navigator)) return;
    try{
      if (wakeWanted && !audio.paused && document.visibilityState === 'visible'){
        if (!wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); }
      } else if (wakeLock){ await wakeLock.release(); wakeLock = null; }
    }catch{}
  }

  function syncChips(){
    $('autoBtn').classList.toggle('on', auto);
    $('djBtn').classList.toggle('on', djOn);
    $('djBtn').style.display = DJ_ENABLED ? '' : 'none';
    $('djTry').classList.toggle('show', djOn);
    $('wakeBtn').classList.toggle('on', wakeWanted);
    $('shuffleBtn').classList.toggle('on', shuffle);
    $('repeatBtn').classList.toggle('on', repeat);
  }

  // --- イベント ---
  $('playBtn').onclick = () => { if (!audio.src) load(false); audio.paused ? audio.play().catch(()=>toast('再生できませんでした')) : audio.pause(); };
  $('nextBtn').onclick = () => next(false);
  $('prevBtn').onclick = prev;
  $('shuffleBtn').onclick = () => { shuffle = !shuffle; store.set('shuffle', shuffle); makeOrder(order[pos]); syncChips(); updateSub(); renderList();
    toast(shuffle ? 'シャッフル ON' : 'シャッフル OFF（上から順番）'); };
  $('repeatBtn').onclick = () => { repeat = !repeat; store.set('repeat', repeat); syncChips(); toast(repeat ? 'ループ ON' : 'ループ OFF'); };
  $('autoBtn').onclick = () => { auto = !auto; store.set('auto', auto); syncChips();
    toast(auto ? (data.schedule?.length ? '時間帯で自動切替 ON' : '時間帯の設定がありません（config.json）') : '自動切替 OFF'); checkSchedule(); };
  $('wakeBtn').onclick = () => { wakeWanted = !wakeWanted; store.set('wake', wakeWanted); syncChips(); applyWake();
    if (!('wakeLock' in navigator)) toast('この端末では未対応です。端末の自動ロックをOFFにしてください'); };
  $('q').oninput = renderList;
  $('q').onkeydown = e => { if (e.key === 'Enter') e.target.blur(); };
  $('clearBtn').onclick = () => { $('q').value = ''; renderList(); };
  $('playSeqBtn').onclick = () => playVisible('seq');
  $('playShfBtn').onclick = () => playVisible('shf');
  $('qchip').onclick = () => { setQueue([...songs().keys()]); makeOrder(order[pos]); updateSub(); renderList();
    toast('全曲の再生に戻しました'); };
  // --- お気に入り（この端末のブラウザにだけ保存） ---
  const FAV_HEAD = 'マルゲッタBGM お気に入り:';
  function saveFavs(){
    store.set('favs', [...favs]);
    // 端末の空き容量が少ないときなどに、ブラウザが勝手に消さないようお願いする
    if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  }
  function showFavs(){
    const s = current();
    $('nowStar').innerHTML = STAR;
    $('nowStar').classList.toggle('on', !!s && favs.has(s.title));
    $('favCount').textContent = `★ お気に入り ${favs.size}曲`;
  }
  function toggleFav(s){
    if (!s) return;
    const on = !favs.has(s.title);
    on ? favs.add(s.title) : favs.delete(s.title);
    saveFavs(); showFavs(); renderTags(); renderList();
    toast(on ? '★ お気に入りに追加しました' : 'お気に入りから外しました');
  }
  $('nowStar').onclick = () => toggleFav(current());
  $('exportBtn').onclick = async () => {
    if (!favs.size){ toast('お気に入りがまだありません'); return; }
    const text = FAV_HEAD + JSON.stringify([...favs]);
    try { await navigator.clipboard.writeText(text); toast('コピーしました。メモやLINEに貼って保存してください'); }
    catch { prompt('この文字をすべてコピーして、メモやLINEに保存してください', text); }
  };
  $('importBtn').onclick = () => {
    const text = prompt('バックアップした文字を貼り付けてください');
    if (!text) return;
    try {
      const list = JSON.parse(text.slice(text.indexOf('[')));
      if (!Array.isArray(list)) throw 0;
      const all = new Set(data.playlists.flatMap(p => p.songs.map(s => s.title)));
      let n = 0;
      for (const t of list) if (typeof t === 'string' && !favs.has(t)){ favs.add(t); if (all.has(t)) n++; }
      saveFavs(); showFavs(); renderTags(); renderList();
      toast(`お気に入りを復元しました（${n}曲を追加）`);
    } catch { alert('読み取れませんでした。バックアップした文字を、最初から最後まで貼り付けてください。'); }
  };

  // --- 歌詞（lyrics/曲名.txt を必要なときに読み込む） ---
  const lyricsCache = {};
  // かっこ書きの行のうち、楽器や演奏の言葉を含むものは指示とみなして出さない（(It’s me) などの合いの手は出す）
  const NOTE = /\b(kick|bass|drums?|snare|shamisen|piano|strings?|solo|answer|phrase|repeat|clap|cuts?|stop|starts?|rising|layer\w*|filter\w*|battle|picking|ending|chords?|groove|unison|fills?|instruments?|flute|sax\w*|guitar|synth|beat|fade\w*|echo|crowd|tension|together|only|intro|outro|instrumental|vocal|rhythm|response|strike|left|right|side|silence|pause|bars?|hit|odaiko|taiko|glissando|melody|riff|arpeggios?|pads?|textures?|stabs?|hooks?|chops?|bells?|percussion|harmonies|lead\w*|overlap|blasts?|bend|motif|humming|tap\w*|heel|toe|click|breath|lyrics|conga\w*|enters|reappear\w*|returns?|whistle|sfx)\b/i;
  // [ ] の行の名前がこれらの言葉を2つ以上含むか、短い名前（3語まで）で1つ含めば区間の見出し。演奏の言葉だけなら指示とみなして出さない
  const SECTION = /\b(intro|verse|pre[- ]?chorus|chorus|post[- ]?chorus|hook|bridge|outro|drop|break|breakdown|build|interlude|rap|solo|call|chant|harmony|response|ad-?libs?|refrain|coda)\b/i;
  async function openLyrics(s){
    if (!s?.lyrics) return;
    $('lyrTitle').textContent = s.title;
    const body = $('lyrBody'); body.innerHTML = '<div class="lyr-msg">読み込み中…</div>';
    $('sheet').classList.add('show'); document.body.style.overflow = 'hidden';
    try {
      lyricsCache[s.lyrics] ??= await fetch(urlOf(s.lyrics), { cache: 'no-cache' }).then(r => { if (!r.ok) throw 0; return r.text(); });
      body.innerHTML = '';
      // SUNOの [Verse 1 – Soft Female Vocal] は「Verse 1」の見出しにし、続く [演奏の指示] の行は出さない。
      // 歌詞のない区間（演奏だけ）は見出しも出さない
      const add = (cls, text) => { const el = document.createElement('div'); el.className = cls; el.textContent = text; body.appendChild(el); };
      let heading = null, prevBracket = false, last = '';
      for (const raw of lyricsCache[s.lyrics].replace(/\r/g, '').trim().split('\n')){
        const line = raw.trim();
        const br = line.match(/^(?:→\s*)?\[(.+)\]$/); // 「→ [Shamisen answer]」のような矢印つきも指示
        if (/^#/.test(line)) continue; // 「# 夏宵」のような見出し記号の行（作業用のメモ）は出さない
        if (/^[(（].*[)）]$/.test(line) && NOTE.test(line)) continue; // (Deep kick starts) などの演奏の指示
        if (br){
          const name = br[1].split(/\s+[–—\/-]\s+|:/)[0].trim();
          const nSec = (name.match(new RegExp(SECTION.source, 'gi')) || []).length;
          const isSection = nSec >= 2 || (nSec === 1 && name.split(/\s+/).length <= 3);
          // 区間名でない [ ] は、見出しがまだ出ていないときに限り見出しにする（[Outro] のすぐ後の [Female whisper] などは指示扱い）
          if (!prevBracket && (isSection || (!NOTE.test(br[1]) && !heading))) heading = name;
          prevBracket = true; continue;
        }
        prevBracket = false;
        if (!line){ if (last === 'ln'){ add('gap', ''); last = 'gap'; } continue; }
        if (heading){ add('sec', heading); heading = null; }
        add('ln', raw.replace(/\*\*/g, '')); last = 'ln'; // **太字** の記号は外す
      }
      if (!body.children.length) add('lyr-msg', 'この曲は歌のない曲です');
      body.scrollTop = 0;
    } catch { body.innerHTML = '<div class="lyr-msg">歌詞を読み込めませんでした</div>'; }
  }
  function closeLyrics(){ $('sheet').classList.remove('show'); document.body.style.overflow = ''; }
  $('nowLyr').onclick = () => openLyrics(current());
  $('lyrClose').onclick = closeLyrics;
  $('sheet').onclick = e => { if (e.target === $('sheet')) closeLyrics(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLyrics(); });

  function showBpm(){
    const s = current();
    $('bpm').textContent = s?.bpm ? `♩ ${bpmOf(s)} BPM${rate !== 100 ? `（${rate}%）` : ''}` : '';
    $('bpm').classList.toggle('show', !!s?.bpm);
  }
  // 音程を保ったまま再生速度を変える（曲が変わっても defaultPlaybackRate で引き継ぐ）
  function applyRate(){
    for (const d of decks){ d.preservesPitch = d.mozPreservesPitch = d.webkitPreservesPitch = true; d.defaultPlaybackRate = rate / 100; }
    audio.playbackRate = rate / 100;
    $('rate').value = rate; fill($('rate'));
    $('rateBtn').textContent = rate + '%'; $('rateBtn').classList.toggle('changed', rate !== 100);
    showBpm();
  }
  function setRate(v){ rate = v; store.set('rate', rate); applyRate(); renderTempos(); renderList(); }
  $('rate').oninput = e => setRate(+e.target.value);
  $('rateBtn').onclick = () => { if (rate !== 100){ setRate(100); toast('テンポを100%に戻しました'); } };

  // --- DJミックス：曲の終わりと次の曲の頭を、テンポと拍をそろえて重ねる ---
  // 曲ごとの拍の位置・実質の終わりは mix.json（scripts/analyze-mix.py で測定）から読む
  const MIX_BARS = 8;               // 重ねる長さ（小節）
  const DJ_ENABLED = false;          // 一時停止中（曲の頭と終わりに低音のある曲が少なく、つなぎの効果が出にくいため）
  let djOn = DJ_ENABLED && store.get('dj', false);
  let ctx = null, chain = null;     // Web Audio（DJミックスを使うときだけ作る）
  let dj = null;                    // 次の曲の準備中・ミックス中の状態
  const other = () => decks.find(d => d !== audio);
  const barLen = g => g.beat * 4;   // g は拍の格子（mix.in = イントロ、mix.out = アウトロ）

  function initGraph(){
    if (ctx){ ctx.resume?.(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    chain = new Map(decks.map(d => {
      const src = ctx.createMediaElementSource(d);
      const low = ctx.createBiquadFilter(); low.type = 'lowshelf'; low.frequency.value = 200; low.gain.value = 0;
      const gain = ctx.createGain();
      src.connect(low); low.connect(gain); gain.connect(ctx.destination);
      return [d, { low, gain }];
    }));
  }
  // iPhone は、一度ボタン操作の中で再生した audio でないと後から再生できないため、ON にしたときに両方を一度鳴らしておく
  function unlockDecks(){
    const d = other();
    if (!d.paused || dj || !audio.src) return;
    d.src = audio.src; d.muted = true;
    d.play().then(() => { d.pause(); d.muted = false; }).catch(() => { d.muted = false; });
  }
  const setLevel = (d, gain, lowDb) => {
    if (!chain) return;
    const c = chain.get(d), t = ctx.currentTime;
    c.gain.gain.setTargetAtTime(gain, t, 0.03);
    c.low.gain.setTargetAtTime(lowDb, t, 0.05);
  };

  // 次に流れる曲（再生順の最後なら、ループで作り直す新しい再生順の先頭）
  function peekNext(){
    if (pendingSwitch != null) return null;
    if (pos < order.length - 1) return { order, pos: pos + 1 };
    if (!repeat) return null;
    const keep = [order, pos]; makeOrder(); const next = { order, pos: 0 }; [order, pos] = keep;
    return next;
  }
  // 出ていく曲の、重ね始める小節の頭（曲の中の秒）。途中から飛ばして過ぎていたら次の小節から
  function mixOutAt(m, now){
    const g = m.out, bar = barLen(g);
    let t = g.downbeat + bar * Math.floor((m.end - MIX_BARS * bar - g.downbeat) / bar);
    if (now > t - 0.3) t = g.downbeat + bar * Math.ceil((now + 0.5 - g.downbeat) / bar);
    return t + MIX_BARS * bar <= m.duration + 1 ? t : null;
  }
  // 入ってくる曲の、音が鳴り始めてから最初の小節の頭
  const mixInAt = m => Math.max(0, m.in.downbeat - barLen(m.in) * Math.floor((m.in.downbeat - m.start + 0.05) / barLen(m.in)));

  function djTick(){
    if (!djOn || !ctx || audio.paused) return;
    // ミックスが終わったあとは、テンポをゆっくり元の設定に戻す
    if (!dj){
      const base = rate / 100, r = audio.playbackRate;
      if (Math.abs(r - base) > 0.001) audio.playbackRate = r + Math.sign(base - r) * Math.min(0.0015, Math.abs(base - r));
    }
    const s = current(), m = s?.mix;
    if (!dj){
      if (!m?.out || !audio.duration) return;
      const at = mixOutAt(m, audio.currentTime);
      if (at == null || audio.currentTime < at - 20) return; // 20秒前から次の曲を用意
      const nx = peekNext(), ns = nx && songs()[nx.order[nx.pos]];
      if (!ns?.mix?.in || ns === s) return;
      const inc = other(), inAt = mixInAt(ns.mix);
      let rateIn = audio.playbackRate * ns.mix.in.beat / m.out.beat;  // 入ってくる曲の速さを今の曲に合わせる
      const matched = rateIn > 0.88 && rateIn < 1.12;          // 差が大きすぎるときは合わせずに重ねるだけ
      if (!matched) rateIn = rate / 100;
      inc.preservesPitch = inc.mozPreservesPitch = inc.webkitPreservesPitch = true;
      inc.src = urlOf(ns.file);
      inc.addEventListener('loadedmetadata', () => { inc.currentTime = inAt; inc.playbackRate = rateIn; }, { once: true });
      setLevel(inc, 0, -30);
      dj = { s, ns, nx, at, inAt, rateIn, matched, inc, started: false, swapped: false };
      return;
    }
    if (dj.s !== s){ djAbort(); return; }
    if (!dj.started){
      if (audio.currentTime < dj.at - 0.02) return;
      dj.started = true;
      dj.inc.currentTime = dj.inAt; dj.inc.playbackRate = dj.rateIn;
      dj.inc.play().catch(() => djAbort());
      $('djBadge').textContent = `🎧 MIX → ${dj.ns.title}`; $('djBadge').classList.add('show');
      return;
    }
    const mo = dj.s.mix.out, mi = dj.ns.mix.in;
    const bars = (audio.currentTime - dj.at) / barLen(mo), p = Math.min(1, bars / MIX_BARS);
    // 拍のずれを、入ってくる曲の速さを少しだけ変えて追いかける（大きくずれたら位置を直す）
    if (dj.matched && !dj.inc.paused){
      const want = dj.inAt + bars * barLen(mi), err = want - dj.inc.currentTime;
      // 最初の1小節（まだほとんど聞こえない間）は細かく位置を合わせ直す。その後は大きくずれたときだけ
      if (Math.abs(err) > (bars < 1 ? 0.025 : 0.12)){ dj.inc.currentTime = want; dj.err = 0; }
      else {
        dj.err = (dj.err || 0) * 0.85 + err * 0.15;  // 読み取りのぶれをならしてから、ゆるやかに補正（音の揺れを防ぐ）
        dj.inc.playbackRate = dj.rateIn * (1 + Math.max(-0.015, Math.min(0.015, dj.err * 0.5)));
      }
    }
    // 前半で次の曲を上げ、後半で今の曲を下げる。真ん中の小節で低音を入れ替える
    const half = bars >= MIX_BARS / 2;
    setLevel(dj.inc, Math.sin(Math.min(1, p * 2) * Math.PI / 2), half ? 0 : -30);
    setLevel(audio, Math.cos(Math.max(0, p * 2 - 1) * Math.PI / 2), half ? -30 : 0);
    if (p >= 1) djFinish();
  }
  function djFinish(){
    const d = dj; dj = null;
    const out = audio; audio = d.inc;
    order = d.nx.order; pos = d.nx.pos;
    out.pause(); setLevel(out, 1, 0); setLevel(audio, 1, 0);
    $('djBadge').classList.remove('show');
    showCurrent();
    $('now').classList.toggle('playing', !audio.paused);
  }
  // 試聴用：今の曲を、次の曲へつなぎ始める10秒前まで進める
  $('djTry').onclick = () => {
    const m = current()?.mix;
    if (!m?.out){ toast('この曲はDJミックスの情報がありません'); return; }
    djAbort();
    const g = m.out, bar = barLen(g);
    const at = g.downbeat + bar * Math.floor((m.end - MIX_BARS * bar - g.downbeat) / bar);
    audio.currentTime = Math.max(0, at - 10);
    if (audio.paused) audio.play().catch(() => {});
  };
  function djAbort(){
    if (!dj) return;
    const inc = dj.inc; dj = null;
    inc.pause(); inc.removeAttribute('src'); inc.load();
    setLevel(inc, 1, 0); setLevel(audio, 1, 0);
    $('djBadge').classList.remove('show');
  }
  if (DJ_ENABLED) setInterval(djTick, 50);
  window.__dj = () => dj && { at: dj.at, inAt: dj.inAt, rateIn: dj.rateIn, matched: dj.matched, started: dj.started, next: dj.ns.title }; // 動作確認用
  $('djBtn').onclick = () => {
    djOn = !djOn; store.set('dj', djOn); syncChips();
    if (djOn){ initGraph(); unlockDecks(); toast('DJミックス ON：曲の終わりを次の曲と重ねてつなぎます'); }
    else { djAbort(); toast('DJミックス OFF'); }
  };
  // 前回 ON のまま開いたときは、最初の画面タッチで準備する（音の処理はタッチの中でしか始められないため）
  if (DJ_ENABLED) document.addEventListener('pointerdown', () => { if (djOn){ initGraph(); unlockDecks(); } }, { once: true, capture: true });

  const fill = el => el.style.setProperty('--p', (el.value - el.min) / (el.max - el.min) * 100 + '%');
  $('vol').oninput = e => { for (const d of decks) d.volume = e.target.value/100; store.set('vol', +e.target.value); fill(e.target); };
  $('seek').oninput = e => { djAbort(); if (audio.duration) audio.currentTime = e.target.value/1000*audio.duration; fill(e.target); };

  // 2台の audio のうち、いま主役の方のイベントだけを扱う
  const onDeck = (ev, fn) => decks.forEach(d => d.addEventListener(ev, () => { if (d === audio) fn(); }));
  onDeck('play', () => { advancing = false; setTimeout(prefetchNext, 3000); setPlaybackState('playing'); $('now').classList.add('playing'); $('playIcon').innerHTML = ICON_PAUSE; renderList(); applyWake(); });
  onDeck('pause', () => { cancelAdvance(); if (dj?.started) djAbort(); setPlaybackState('paused'); $('now').classList.remove('playing'); $('playIcon').innerHTML = ICON_PLAY; renderList(); applyWake(); });
  onDeck('ended', () => { if (dj?.started) djFinish(); else if (!advancing) next(true); });
  onDeck('loadedmetadata', () => { audio.playbackRate = rate / 100; }); // 一部の端末は曲ごとに速度が戻るため
  // 読み込めないとき：電波がない（または続けて失敗する）なら、飛ばさずに電波が戻るのを待って同じ曲からやり直す
  let failCount = 0, waitOnline = false;
  onDeck('error', () => {
    if (!audio.src) return;
    djAbort();
    if (!navigator.onLine || ++failCount >= 3){
      waitOnline = true; failCount = 0;
      toast('電波が戻ったら再開します');
      return;
    }
    toast('読み込めない曲をスキップしました'); setTimeout(() => next(true), 800);
  });
  onDeck('playing', () => { failCount = 0; });
  window.addEventListener('online', () => { if (waitOnline){ waitOnline = false; load(true); } });
  onDeck('timeupdate', () => {
    scheduleAdvance();
    $('cur').textContent = fmt(audio.currentTime); $('dur').textContent = fmt(audio.duration);
    if (audio.duration){ $('seek').value = audio.currentTime/audio.duration*1000; fill($('seek')); }
  });
  // 画面ロック中も次の曲へ進めるよう、曲の音が終わるちょうどその時に、同じ audio のまま次の曲に切り替える。
  // 音が完全に止まると、iPhone や Android はその瞬間にページを止めてしまい、次の曲を始められないことがあるため。
  // 位置の知らせ（timeupdate）は1秒に数回しか来ないので、終わる3秒前からはタイマーで時刻を合わせる
  let advanceTimer = null;
  function cancelAdvance(){ clearTimeout(advanceTimer); advanceTimer = null; }
  function scheduleAdvance(){
    const hasNext = pendingSwitch != null || pos < order.length - 1 || repeat;
    if (advanceTimer || advancing || dj || !hasNext || audio.paused || !audio.duration) return;
    // 曲の最後に無音がある曲は、音が本当になくなったところで切り替える（mix.json の silence。余韻は残す）
    const end = Math.min(audio.duration, (current()?.mix?.silence ?? audio.duration) + 0.05);
    const remain = (end - audio.currentTime) / audio.playbackRate;
    if (remain > 3) return;
    advanceTimer = setTimeout(() => {
      advanceTimer = null;
      if (!advancing && !audio.paused){ advancing = true; next(true); }
    }, Math.max(0, remain - 0.05) * 1000);
  }
  onDeck('seeking', cancelAdvance);
  document.addEventListener('visibilitychange', applyWake);
  // ロック画面の再生・一時停止の表示を合わせる
  function setPlaybackState(st){ if ('mediaSession' in navigator) try { navigator.mediaSession.playbackState = st; } catch {} }
  if ('mediaSession' in navigator){
    navigator.mediaSession.setActionHandler('play', () => audio.play());
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('nexttrack', () => next(false));
    navigator.mediaSession.setActionHandler('previoustrack', prev);
  }

  // --- 起動 ---
  const v = store.get('vol', 70); $('vol').value = v; for (const d of decks) d.volume = v/100; fill($('vol'));
  applyRate(); showFavs();
  syncChips();
  fetch('songs.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(json => {
      data = json;
      if (!data.playlists?.length || !data.playlists.some(p => p.songs.length)) throw 'empty';
      let i = auto ? scheduledPlaylist() : -1;
      if (i < 0) i = Math.max(0, data.playlists.findIndex(p => p.id === store.get('pl', '')));
      plIndex = i; setQueue([...songs().keys()]); makeOrder(); renderTabs(); renderTags(); load(false);
      setInterval(checkSchedule, 30000);
    })
    .catch(e => {
      $('title').textContent = '曲がまだありません';
      $('finder').style.display = $('backup').style.display = 'none';
      $('list').outerHTML = `<div class="msg">GitHub の <b>music</b> フォルダに MP3 をアップロードすると、数分後にここに曲が表示されます。<br>
        フォルダ分け（例：music/lunch、music/dinner）するとプレイリストになります。</div>`;
    });
})();
</script>
</body>
</html>
