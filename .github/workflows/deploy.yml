name: プレーヤーを公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # 公開の途中で取り消すと、GitHub 側の公開が詰まることがあるため、順番待ちにする

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # 曲を追加した日（NEW 表示）を履歴から調べるため
          filter: blob:none    # 履歴は名前と日付だけ取り、消した曲の音声は取らない
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 曲リスト(songs.json)を作成
        run: node scripts/build-songs.mjs .
      - name: 公開するファイルをまとめる
        run: |
          mkdir -p _site music
          cp -r index.html songs.json music _site/
          if [ -d lyrics ]; then cp -r lyrics _site/; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000   # 公開に時間がかかるときも30分まで待つ（初期値は10分）
